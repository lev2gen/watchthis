name: watchthis

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchthis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: watchthis
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchthis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgres://watchthis:${POSTGRES_PASSWORD}@db:5432/watchthis
    volumes:
      - static:/static
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Only exposed on localhost — the host nginx proxies the domain here.
      # If 8090 is busy on your server, change the left side (e.g. 127.0.0.1:8091:80)
      - "127.0.0.1:8090:80"
    volumes:
      - static:/usr/share/nginx/html:ro
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  dbdata:
  static:
